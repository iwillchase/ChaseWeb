<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>IWILLCHASE</title>
  <meta name="description" content="Art by Chase: sketchbook pages, portraits, and small games." />
  <meta name="theme-color" content="#000000" />

  <!-- Tab icon: a white triangle on black, like the CHASE field -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='black'/%3E%3Cpath d='M16 6 L27 25 H5 Z' fill='none' stroke='white' stroke-width='2.5' stroke-linejoin='round'/%3E%3C/svg%3E" />

  <!-- Link previews (texts, email, social) -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://iwillchase.github.io/ChaseWeb/" />
  <meta property="og:title" content="IWILLCHASE" />
  <meta property="og:description" content="Art by Chase: sketchbook pages, portraits, and small games." />
  <meta property="og:image" content="https://iwillchase.github.io/ChaseWeb/img/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Three sketchbook pages" />
  <meta name="twitter:card" content="summary_large_image" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      touch-action: manipulation; /* no double-tap zoom on phones */
      -webkit-tap-highlight-color: transparent;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
      z-index: 2; /* triangles above galleries' backdrop, below the buttons */
    }

    .button-bar {
      position: fixed;
      bottom: calc((100vh - 65vh) / 4);
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 18px;
      z-index: 4; /* always above the triangle field */
    }

    .button-bar button {
      padding: 16px 36px;
      border-radius: 999px;
      /* Frosted glass: the triangle field's colors show through, blurred */
      border: 2px solid rgba(255, 255, 255, 0.55);
      background: rgba(0, 0, 0, 0.5);
      color: white;
      font-size: 20px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: 0.2s ease;
    }

    @media (hover: hover) {
      .button-bar button:hover {
        border-color: #ffffff;
        background: rgba(0, 0, 0, 0.65); /* a little darker on hover, still glassy */
        transform: translateY(-2px);
      }
    }

    .button-bar button.active {
      background: #f5f5f5;
      color: #000000;
      border-color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 0 16px rgba(255, 255, 255, 0.25);
    }

    .gallery {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: calc(100vw - 80px);
      height: 65vh;

      padding: 24px 48px;
      border-radius: 20px;

      background: rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(1px);
      border: 1px solid rgba(255, 255, 255, 0.15);

      display: none;
      align-items: center;
      z-index: 3;
      box-sizing: border-box;

      box-shadow:
        0 12px 30px rgba(0, 0, 0, 0.45),
        0 4px 10px rgba(0, 0, 0, 0.25);
    }

    .gallery.visible { display: flex; }

    .gallery-strip {
      display: flex;
      gap: 16px;
      height: 100%;
      width: 100%;
      box-sizing: border-box;
      padding: 18px; /* room for the NEW star, which sticks out past the image corner */
      overflow-x: auto;
      scroll-behavior: smooth;
      scrollbar-width: none;
    }

    .gallery-strip::-webkit-scrollbar { display: none; }

    .gallery-item {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      height: 100%;
    }

    /* Clickable tiles (used by misc) */
    .gallery-link {
      flex-shrink: 0;
      height: 100%;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      outline: none;
      cursor: pointer;
    }

    .gallery-item img,
    .gallery-link img {
      height: 100%;
      max-height: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      border-radius: 14px;
      border: 1px solid #ffffff33;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }

    .gallery-item img {
      cursor: zoom-in;
    }

    .gallery-item span,
    .gallery-link span {
      color: #ffffffcc;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* Hover highlight + "clickable" affordance */
    .gallery-link .thumb {
      position: relative;
      height: 100%;
      display: flex;
      align-items: stretch;
    }

    .gallery-link .cta {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.35);
      background: rgba(0,0,0,0.55);
      color: rgba(255,255,255,0.95);
      font-size: 12px;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      transition: opacity 0.18s ease, transform 0.18s ease;
      backdrop-filter: blur(6px);
      pointer-events: none;
      box-shadow: 0 10px 25px rgba(0,0,0,0.45);
      white-space: nowrap;
    }

    .gallery-link:hover img,
    .gallery-link:focus-visible img {
      transform: translateY(-2px) scale(1.01);
      border-color: rgba(255,255,255,0.75);
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.82), 0 0 12px rgba(255,255,255,0.12);
    }

    .gallery-link:hover .cta,
    .gallery-link:focus-visible .cta {
      opacity: 1;
      transform: translate(-50%, -52%);
    }

    .gallery-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      border-radius: 999px;
      border: 1px solid #ffffff66;
      background: #000000cc;
      color: #ffffff;
      font-size: 24px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(6px);
      user-select: none;
      transition: 0.15s ease;
    }

    .gallery-arrow:hover {
      border-color: #ffffff;
      background: #111111ee;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    }

    .gallery-arrow.left { left: 12px; }
    .gallery-arrow.right { right: 12px; }

    /* About panel: sits in the space ABOVE the section buttons and centers itself
       there (top/bottom insets + fit-content height + auto margins), so it never
       overlaps the buttons on short screens. */
    .floating-panel {
      position: fixed;
      top: 16px;
      bottom: calc((100vh - 65vh) / 4 + 80px);
      left: 50%;
      height: fit-content;
      max-height: calc(100vh - 16px - (100vh - 65vh) / 4 - 80px);
      margin: auto 0;
      overflow-y: auto;
      transform: translateX(-50%);
      width: min(70vw, 700px);
      padding: 28px 40px;
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow:
        0 12px 30px rgba(0,0,0,0.45),
        0 4px 10px rgba(0,0,0,0.25);
      display: none;
      z-index: 4;
      box-sizing: border-box;
      text-align: center;
      color: white;
      animation: fadeUp 0.4s ease-out;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .floating-panel.visible { display: flex; }

    .about-photo {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 18px;
      border: 2px solid rgba(255,255,255,0.3);
    }

    .floating-panel h2 {
      margin: 0 0 10px;
      font-size: 26px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .floating-panel p {
      margin: 4px 0;
      font-size: 15px;
      line-height: 1.6;
      max-width: 32rem;
    }

    /* About panel: photo, name, one-line intro, links, divider, subscribe */
    .about-bio { color: rgba(255,255,255,0.85); font-size: 16px !important; margin: 0 0 8px !important; }

    .about-links {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      font-size: 16px !important;
    }

    .about-sep { color: rgba(255,255,255,0.5); }

    .about-divider {
      width: 70%;
      border: none;
      border-top: 1px solid rgba(255,255,255,0.2);
      margin: 20px 0 18px;
    }

    /* Shorter screens: smaller photo so it all fits without scrolling */
    @media (max-height: 760px) {
      .about-photo { width: 110px; height: 110px; margin-bottom: 12px; }
      .about-divider { margin: 14px 0 12px; }
    }

    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10;
      padding: 24px;
      box-sizing: border-box;
      cursor: zoom-out;
    }

    .lightbox.visible {
      display: flex;
    }

    .lightbox img {
      display: block;
      width: auto;
      max-width: 100%;
      height: calc(100vh - 48px);
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255,255,255,0.18);
      cursor: zoom-out;
    }

    .lightbox-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 56px;
      height: 56px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(0,0,0,0.42);
      color: white;
      font-size: 32px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      backdrop-filter: blur(8px);
      transition: 0.18s ease;
    }

    .lightbox-nav:hover {
      background: rgba(20,20,20,0.72);
      border-color: rgba(255,255,255,0.65);
      box-shadow: 0 0 16px rgba(255,255,255,0.12);
    }

    .lightbox-nav.left {
      left: 20px;
    }

    .lightbox-nav.right {
      right: 20px;
    }

    .lightbox-counter {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.85);
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.12);
    }

    /* Newsletter signup (About panel) */
    .subscribe {
      width: 100%;
      max-width: 26rem;
    }

    .subscribe[hidden] { display: none; }

    .subscribe-title {
      font-size: 15px !important;
      color: rgba(255,255,255,0.85);
      margin: 0 0 10px !important;
    }

    .subscribe-row {
      display: flex;
      gap: 8px;
    }

    .subscribe input {
      flex: 1;
      min-width: 0;
      padding: 12px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.4);
      background: rgba(0,0,0,0.5);
      color: white;
      font-size: 16px; /* 16px+ stops iPhones zooming in on tap */
      font-family: inherit;
    }

    .subscribe input::placeholder { color: rgba(255,255,255,0.5); }

    .subscribe button {
      padding: 12px 18px;
      border-radius: 999px;
      border: 2px solid #ffffffcc;
      background: #f5f5f5;
      color: black;
      font-size: 14px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
    }

    /* Clear focus ring for keyboard users */
    button:focus-visible,
    a:focus-visible,
    input:focus-visible,
    .gallery-item img:focus-visible {
      outline: 3px solid #ffffff;
      outline-offset: 3px;
    }

    .gallery-link:focus-visible { outline: none; } /* its image gets the hover look instead */

    /* People who turn on "reduce motion" get a still page */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
        animation: none !important;
        scroll-behavior: auto !important;
      }
    }

    /* NEW pages: a white "NEW" star on the image's top-right corner.
       Its outline uses --new-color: the first color of the section's triangle
       palette, or black for sections without colored triangles (set by the script). */
    :root { --new-color: #c5d7e5; }

    .gallery-item,
    .gallery-link { position: relative; }

    .new-star {
      position: absolute;
      top: -12px;
      right: -12px;
      width: 62px;
      height: 62px;
      transform: rotate(12deg);
      z-index: 2;
      pointer-events: none;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.55));
    }

    .new-star svg { width: 100%; height: 100%; display: block; }

    .new-star polygon {
      fill: #ffffff;
      stroke: var(--new-color);
      stroke-width: 3.5;
      stroke-linejoin: round;
    }

    .new-star text {
      fill: #000000;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      font-weight: 800;
    }

    /* Phones: the image is centered in a wider/taller frame, so pin the star to the
       image's own corner (image is --img-w wide at 3:4, so half its height is --img-w * 2/3) */
    .phone .new-star {
      top: calc(50% - var(--img-w) * 2 / 3 - 12px);
      right: calc(50% - var(--img-w) / 2 - 12px);
    }

    /* Misc sub-categories: a "———— GAMES ————" label spanning a group of tiles */
    /* The label tucks up into the strip's top padding, so the tiles start only
       ~6px lower than in the other sections */
    .misc-group {
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      height: calc(100% + 14px);
      margin-top: -14px;
      gap: 4px;
    }

    .group-label {
      display: flex;
      align-items: center;
      gap: 14px;
      height: 16px;
      flex-shrink: 0;
    }

    .group-label::before,
    .group-label::after {
      content: "";
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.45);
    }

    .group-label-empty::before,
    .group-label-empty::after { display: none; }

    /* Just text, no pill; a soft shadow keeps it readable over busy backgrounds */
    .group-label span,
    .phone .misc-group .gallery-link::after {
      color: white;
      font-size: 13px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      white-space: nowrap;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9), 0 0 8px rgba(0,0,0,0.6);
    }

    .group-items {
      display: flex;
      gap: 16px;
      flex: 1;
      min-height: 0;
    }

    /* Grouped tiles get an exact 3:4 width from the strip's height (minus the
       label row), so the group, and its label line, is exactly as wide as its tiles.
       (Phone rules further down override this.) */
    .gallery-strip { container-type: size; }

    .group-items > .gallery-link,
    .group-items > .gallery-item {
      width: calc((100cqh - 6px) * 3 / 4); /* tile height = strip height + 14px tuck - 16px label - 4px gap */
      height: 100%;
    }

    .group-items .thumb { width: 100%; }

    .group-items img {
      width: 100%;
      height: 100%;
    }

    /* Phones show one tile at a time, so the label can't span the group:
       tiles join the swipe row directly and each game gets its own small tag */
    .phone .misc-group,
    .phone .group-items { display: contents; }
    .phone .group-label { display: none; }

    .phone .misc-group .gallery-link::after {
      content: "Games";
      position: absolute;
      left: 50%;
      top: calc(50% - var(--img-w) * 2 / 3 + 12px);
      transform: translateX(-50%);
      font-size: 12px;
      pointer-events: none;
    }

    /* Caption on tiles that aren't links (e.g. ColorBase).
       Looks and behaves like the "Play Game!" label: appears on hover, always shown on phones. */
    .tile-caption {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.35);
      background: rgba(0,0,0,0.55);
      color: rgba(255,255,255,0.95);
      font-size: 12px;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.18s ease, transform 0.18s ease;
      backdrop-filter: blur(6px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.45);
    }

    .gallery-item.captioned img { cursor: default; } /* no full-size viewer in Misc */

    .gallery-item.captioned:hover img {
      transform: translateY(-2px) scale(1.01);
      border-color: rgba(255,255,255,0.75);
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.82), 0 0 12px rgba(255,255,255,0.12);
    }

    .gallery-item.captioned:hover .tile-caption {
      opacity: 1;
      transform: translate(-50%, -52%);
    }

    /* Phones: always shown, and sits at the image's bottom edge so the ‹ › arrows don't cover it
       (same image-size math as the NEW tag) */
    .phone .tile-caption,
    .phone .gallery-item.captioned:hover .tile-caption {
      opacity: 1;
      font-size: 13px;
      padding: 10px 14px;
      top: auto;
      bottom: calc(50% - var(--img-w) * 2 / 3 + 14px);
      transform: translateX(-50%);
    }

    .contact-btn {
      background: none;
      border: none;
      padding: 0;
      font: inherit;
      cursor: pointer;
    }

    .about-link {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .gallery-count { display: none; }

    /* ===== Phone mode (html.phone is set by script) ===== */
    .phone .button-bar {
      left: 16px;
      right: 16px;
      bottom: calc(16px + env(safe-area-inset-bottom));
      transform: none;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 12px;
    }

    .phone .button-bar button {
      padding: 16px 8px;
      /* 18px on most phones, shrinking a bit on very narrow ones so SKETCHBOOK fits */
      font-size: clamp(14px, 4.5vw, 18px);
      letter-spacing: 0.06em;
    }

    .phone .gallery {
      top: calc(16px + env(safe-area-inset-top));
      left: 16px;
      right: 16px;
      bottom: calc(160px + env(safe-area-inset-bottom));
      width: auto;
      height: auto;
      transform: none;
      padding: 12px;
    }

    /* One image per screen: swipe to the next one */
    .phone .gallery-strip {
      gap: 0;
      padding: 18px 0; /* no side padding: keeps one image per swipe */
      scroll-snap-type: x mandatory;
    }

    .phone .gallery-item,
    .phone .gallery-link {
      flex: 0 0 100%;
      width: 100%;
      justify-content: center;
      scroll-snap-align: center;
      scroll-snap-stop: always;
    }

    .phone .gallery-link .thumb {
      width: 100%;
      align-items: center;
      justify-content: center;
    }

    /* Every image is the same 3:4 cropped tile, as big as fits the screen */
    .phone .gallery-item,
    .phone .gallery-link {
      container-type: size;
      /* image width: fills the frame, leaving 18px each side for the NEW star */
      --img-w: min(calc(100cqw - 36px), 75cqh);
    }

    .phone .gallery-item img,
    .phone .gallery-link img {
      width: var(--img-w);
      height: auto;
      max-height: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      cursor: default;
    }

    .phone .gallery-link .cta {
      opacity: 1;
      transform: translate(-50%, -50%);
      font-size: 15px;
      padding: 12px 18px;
    }

    .phone .gallery-arrow {
      width: 44px;
      height: 44px;
      background: #000000aa;
    }

    .phone .gallery-arrow.left { left: 4px; }
    .phone .gallery-arrow.right { right: 4px; }

    .phone .gallery-count {
      display: block;
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.9);
      font-size: 13px;
      letter-spacing: 0.12em;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(0,0,0,0.55);
      pointer-events: none;
    }

    .phone .floating-panel {
      top: calc(16px + env(safe-area-inset-top));
      bottom: calc(160px + env(safe-area-inset-bottom));
      max-height: calc(100vh - 176px);
      width: calc(100vw - 32px);
      padding: 22px 20px;
    }

    .phone .floating-panel p { font-size: 17px; }

    /* Phone held sideways: buttons in one row so the art gets the height */
    @media (orientation: landscape) {
      .phone .button-bar {
        left: 50%;
        right: auto;
        bottom: calc(10px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        display: flex;
        gap: 10px;
      }

      .phone .button-bar button {
        padding: 10px 20px;
        font-size: 16px;
      }

      .phone .gallery {
        top: 10px;
        bottom: calc(66px + env(safe-area-inset-bottom));
        left: calc(16px + env(safe-area-inset-left));
        right: calc(16px + env(safe-area-inset-right));
      }

      .phone .floating-panel {
        top: 10px;
        bottom: calc(66px + env(safe-area-inset-bottom));
        max-height: calc(100vh - 76px);
        padding: 14px 20px;
      }
      /* Sideways phones are short: compact About panel so it fits without scrolling */
      .phone .about-photo { width: 64px; height: 64px; margin-bottom: 6px; }
      .phone .floating-panel h2 { font-size: 20px; margin-bottom: 2px; }

  <script>
    const canvas = document.getElementById("triText");
    const ctx = canvas.getContext("2d");

    const textCanvas = document.createElement("canvas");
    const textCtx = textCanvas.getContext("2d");

    const WORD = "CHASE";
    let TRI_SIZE_CURRENT = 12;
    const BASE_CELL = 12;
    const DRAW_SPEED = 800;
    const SAMPLE_THRESHOLD = 10;

    // Scatter physics
    const SPRING_STRENGTH = 17.0;
    const DAMPING = 0.85;
    const INFLUENCE_RADIUS = 340;
    const MAX_FORCE = 70;
    // "Reduce motion" setting on the device: no build-in, no scatter
    const REDUCED_MOTION = window.matchMedia("(prefers-reduced-motion: reduce)");
    let scatterEnabled = !REDUCED_MOTION.matches;
    REDUCED_MOTION.addEventListener("change", () => {
      scatterEnabled = !REDUCED_MOTION.matches;
      wake();
    });

    // Mood fade
    let moodIntensity = 0.0;
    let moodIntensityTarget = 0.0;
    const MOOD_FADE_SPEED = 6.0;

    const PALETTES = {
      journal: [
        ["#264653","#2a9d8f","#e9c46a","#f4a261","#e76f51"],
        ["#C5D7E5","#B38D84","#DEBB95","#F8EACF","#F8F5EC"], // Sketchbook (blue first = NEW color)
        ["#f7f3e8","#bacdb0","#729b79","#475b63","#2e2c2f"],
        ["#331832","#d81e5b","#f0544f","#c6d8d3","#fdf0d5"],
        ["#cee5f2","#accbe1","#7c98b3","#637081","#536b78"],
        ["#d9ed92","#b5e48c","#99d98c","#76c893","#52b69a","#34a0a4","#168aad","#1a759f","#1e6091","#184e77"],
        ["#b38d84","#debb95","#f8eacf","#f8f5ec","#c5d7e5"],
        ["#393d3f","#fdfdff","#c6c5b9","#62929e","#546a7b"],
        ["#f8f9fa","#e9ecef","#dee2e6","#ced4da","#adb5bd","#6c757d","#495057","#343a40","#212529"],
        ["#03071e","#370617","#6a040f","#9d0208","#d00000","#dc2f02","#e85d04","#f48c06","#faa307","#ffba08"],
        ["#001219","#005f73","#0a9396","#94d2bd","#e9d8a6","#ee9b00","#ca6702","#bb3e03","#ae2012","#9b2226"],
        ["#cdb4db","#ffc8dd","#ffafcc","#bde0fe","#a2d2ff"],
        ["#582f0e","#7f4f24","#936639","#a68a64","#b6ad90","#c2c5aa","#a4ac86","#656d4a","#414833","#333d29"],
        ["#cb997e","#ddbea9","#ffe8d6","#b7b7a4","#a5a58d","#6b705c"],
        ["#c9cba3","#ffe1a8","#e26d5c","#723d46","#472d30"],
        ["#a5d8ff","#eff2c0","#bea57d","#71816d","#3a3238"],
      ],
      misc: [
        ["#f8f9fa","#e9ecef","#dee2e6","#ced4da","#adb5bd","#6c757d","#495057","#343a40","#212529"],
        ["#03071e","#370617","#6a040f","#9d0208","#d00000","#dc2f02","#e85d04","#f48c06","#faa307","#ffba08"],
        ["#001219","#005f73","#0a9396","#94d2bd","#e9d8a6","#ee9b00","#ca6702","#bb3e03","#ae2012","#9b2226"],
      ],
      clean: [["#ffffff"]]
    };

    const MOODS = {
      portraits: {
        triSize: 12,
        outline: { enabled: true, color: "#ffffff", alpha: 1.0, width: 1.0 },
        fill:    { enabled: false, ratio: 0.0, alpha: 0.0, paletteKey: "clean", paletteIndex: 0, invert: false },
        overlay: "portraits"
      },
      journal: {
        triSize: 30,
        outline: { enabled: false, color: "#ffffff", alpha: 0.95, width: 1.0 },
        fill:    { enabled: true, ratio: 0.70, alpha: 0.85, paletteKey: "journal", paletteIndex: 1, invert: false },
        overlay: "journal"
      },
      misc: {
        triSize: 30,
        outline: { enabled: false, color: "#ffffff", alpha: 0.95, width: 1.0 },
        fill:    { enabled: true, ratio: 0.70, alpha: 0.85, paletteKey: "journal", paletteIndex: 0, invert: false },
        overlay: "misc"
      },
      about: {
        triSize: 18,
        outline: { enabled: false, color: "#ffffff", alpha: 1.0, width: 1.0 },
        fill:    { enabled: true, ratio: 0.70, alpha: 0.85, paletteKey: "journal", paletteIndex: 2, invert: false },
        overlay: "about"
      }
    };

    const PHONE_QUERY = window.matchMedia("(max-width: 768px), (pointer: coarse) and (max-height: 500px)");
    let isPhone = PHONE_QUERY.matches;

    let activeSection = null;
    let currentMood = MOODS.portraits;

    let triangles = [];
    let visibleCount = 0;
    let lastTimestamp = 0;
    let doneBuild = false;

    function pickPaletteColor(paletteKey, paletteIndex) {
      const group = PALETTES[paletteKey] || [["#ffffff"]];
      const pal = group[Math.max(0, Math.min(paletteIndex, group.length - 1))];
      return pal[Math.floor(Math.random() * pal.length)];
    }

    function rerollFillStylesForMood(mood) {
      for (const t of triangles) {
        t.filledFlag = Math.random() < (mood.fill.ratio || 0.0);
        t.fillColor  = pickPaletteColor(mood.fill.paletteKey, mood.fill.paletteIndex);
      }
    }

    function applyMood(mood, { rebuild = false, rerollStyles = true } = {}) {
      currentMood = mood;
      moodIntensityTarget = mood.fill.enabled ? 1.0 : 0.0;
      TRI_SIZE_CURRENT = mood.triSize;

      if (rebuild) {
        TRI_SIZE_CURRENT = mood.triSize;
        generateTriangles();
        visibleCount = 0;
        doneBuild = false;
        wake();
        return;
      }

      if (rerollStyles) {
        rerollFillStylesForMood(mood);
      }
      wake();
    }

    let animating = false;
    let lastW = 0, lastH = 0;

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      const w = window.innerWidth;
      const h = window.innerHeight;

      // Phone browsers resize a little when the address bar slides in/out.
      // Skip those so the CHASE letters don't rebuild every time.
      if (isPhone && w === lastW && Math.abs(h - lastH) < 120) return;
      lastW = w;
      lastH = h;

      canvas.width = w * dpr;
      canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      textCanvas.width = w;
      textCanvas.height = h;

      generateTriangles();
      visibleCount = 0;
      doneBuild = false;
      wake();
    }

    // Start the draw loop if it's asleep. It stops itself once nothing moves,
    // so a settled page uses no battery.
    function wake() {
      if (animating) return;
      animating = true;
      lastTimestamp = 0;
      requestAnimationFrame(animate);
    }

    function generateTriangles() {
      const w = textCanvas.width;
      const h = textCanvas.height;

      textCtx.clearRect(0, 0, w, h);

      let fontSize = Math.min(w / 3, h * 0.6);
      textCtx.font = `bold ${fontSize}px sans-serif`;

      const metrics = textCtx.measureText(WORD);
      const targetWidth = w * 0.8;
      fontSize *= (targetWidth / metrics.width);

      textCtx.font = `bold ${fontSize}px sans-serif`;
      textCtx.textAlign = "center";
      textCtx.textBaseline = "middle";
      textCtx.fillStyle = "white";
      textCtx.fillText(WORD, w / 2, h / 2);

      const imageData = textCtx.getImageData(0, 0, w, h).data;

      triangles = [];
      // Phones get twice as many triangles (half the area per triangle)
      const cell = isPhone ? BASE_CELL / Math.SQRT2 : BASE_CELL;
      const rows = Math.ceil(h / cell);
      const cols = Math.ceil(w / cell);

      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
          const cx = col * cell + cell / 2;
          const cy = row * cell + cell / 2;
          if (cx >= w || cy >= h) continue;

          const idx = (Math.floor(cy) * w + Math.floor(cx)) * 4;
          const alpha = imageData[idx + 3];
          if (alpha > SAMPLE_THRESHOLD) continue;

          const upright = (row + col) % 2 === 0;

          triangles.push({
            cx, cy, upright,
            offsetX: 0, offsetY: 0,
            vx: 0, vy: 0,
            filledFlag: Math.random() < (currentMood.fill.ratio || 0.0),
            fillColor: pickPaletteColor(currentMood.fill.paletteKey, currentMood.fill.paletteIndex),
          });
        }
      }

      shuffle(triangles);
    }

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    }

    function updatePhysics(dt) {
      let moving = false;
      const count = Math.floor(visibleCount);
      for (let i = 0; i < count && i < triangles.length; i++) {
        const t = triangles[i];

        const ax = -t.offsetX * SPRING_STRENGTH;
        const ay = -t.offsetY * SPRING_STRENGTH;

        t.vx += ax * dt;
        t.vy += ay * dt;

        t.vx *= DAMPING;
        t.vy *= DAMPING;

        t.offsetX += t.vx * dt;
        t.offsetY += t.vy * dt;

        if (!moving && (Math.abs(t.offsetX) > 0.05 || Math.abs(t.offsetY) > 0.05 ||
                        Math.abs(t.vx) > 0.5 || Math.abs(t.vy) > 0.5)) {
          moving = true;
        }
      }
      return moving; // true while any triangle is still springing back
    }

    function clearCanvas() {
      ctx.clearRect(0, 0, textCanvas.width, textCanvas.height);
    }

    function drawTriangles(count) {
      clearCanvas();

      // Shrink to match the tighter phone grid so triangles tile instead of piling up
      const cell = isPhone ? TRI_SIZE_CURRENT / Math.SQRT2 : TRI_SIZE_CURRENT;
      const o = currentMood.outline;
      const f = currentMood.fill;

      for (let i = 0; i < count && i < triangles.length; i++) {
        const t = triangles[i];
        const half = cell / 2;

        const cx = t.cx + t.offsetX;
        const cy = t.cy + t.offsetY;

        let p1, p2, p3;
        if (t.upright) {
          p1 = { x: cx,         y: cy - half };
          p2 = { x: cx - half,  y: cy + half };
          p3 = { x: cx + half,  y: cy + half };
        } else {
          p1 = { x: cx,         y: cy + half };
          p2 = { x: cx - half,  y: cy - half };
          p3 = { x: cx + half,  y: cy - half };
        }

        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.lineTo(p3.x, p3.y);
        ctx.closePath();

        if (f.enabled && moodIntensity > 0.001) {
          const doFill = f.invert ? !t.filledFlag : t.filledFlag;
          if (doFill) {
            ctx.save();
            ctx.globalAlpha = f.alpha * moodIntensity;
            ctx.fillStyle = t.fillColor;
            ctx.fill();
            ctx.restore();
          }
        }

        if (o.enabled) {
          ctx.save();
          ctx.globalAlpha = o.alpha;
          ctx.strokeStyle = o.color;
          ctx.lineWidth = o.width;
          ctx.stroke();
          ctx.restore();
        }
      }
    }

    function animate(timestamp) {
      if (!lastTimestamp) lastTimestamp = timestamp;
      const dt = Math.min(0.05, (timestamp - lastTimestamp) / 1000); // no jumps after a pause
      lastTimestamp = timestamp;

      if (REDUCED_MOTION.matches) {
        visibleCount = triangles.length;
        doneBuild = true;
        moodIntensity = moodIntensityTarget;
      }

      if (!doneBuild) {
        // Double speed on phones so the denser field builds in the same time
        visibleCount += DRAW_SPEED * (isPhone ? 2 : 1) * dt;
        if (visibleCount >= triangles.length) {
          visibleCount = triangles.length;
          doneBuild = true;
        }
      }

      const moving = updatePhysics(dt);

      moodIntensity += (moodIntensityTarget - moodIntensity) * Math.min(1, dt * MOOD_FADE_SPEED);
      const fading = Math.abs(moodIntensityTarget - moodIntensity) > 0.002;
      if (!fading) moodIntensity = moodIntensityTarget;

      if (doneBuild && !moving && !fading) {
        // Everything has settled: draw one clean final frame and sleep
        for (const t of triangles) { t.offsetX = t.offsetY = t.vx = t.vy = 0; }
        drawTriangles(Math.floor(visibleCount));
        animating = false;
        return;
      }

      drawTriangles(Math.floor(visibleCount));
      requestAnimationFrame(animate);
    }

    function applyMouseImpulse(x, y) {
      if (!scatterEnabled) return;

      let pushed = false;
      const count = Math.floor(visibleCount);
      for (let i = 0; i < count && i < triangles.length; i++) {
        const t = triangles[i];

        const dx = t.cx - x;
        const dy = t.cy - y;
        const dist = Math.hypot(dx, dy);
        if (dist === 0 || dist > INFLUENCE_RADIUS) continue;

        const strength = 1 - dist / INFLUENCE_RADIUS;
        const force = MAX_FORCE * strength;

        t.vx += (dx / dist) * force;
        t.vy += (dy / dist) * force;
        pushed = true;
      }

      if (pushed) wake();
    }

    window.addEventListener("mousemove", (e) => applyMouseImpulse(e.clientX, e.clientY));
    window.addEventListener("touchmove", (e) => {
      const touch = e.touches[0];
      if (touch) applyMouseImpulse(touch.clientX, touch.clientY);
    }, { passive: true });

    window.addEventListener("resize", resize);

    // ===== UI =====
    const buttonBar        = document.getElementById("button-bar");
    const portraitsBtn     = document.getElementById("btn-portraits");
    const journalBtn       = document.getElementById("btn-journal");
    const miscBtn          = document.getElementById("btn-misc");
    const aboutBtn         = document.getElementById("btn-about");

    const portraitsGallery = document.getElementById("portraits-gallery");
    const portraitsStrip   = document.getElementById("portraits-strip");
    const journalGallery   = document.getElementById("journal-gallery");
    const journalStrip     = document.getElementById("journal-strip");
    const miscGallery      = document.getElementById("misc-gallery");
    const miscStrip        = document.getElementById("misc-strip");
    const aboutPanel       = document.getElementById("about-panel");

    const lightbox         = document.getElementById("lightbox");
    const lightboxImage    = document.getElementById("lightbox-image");
    const lightboxPrev     = document.getElementById("lightbox-prev");
    const lightboxNext     = document.getElementById("lightbox-next");
    const lightboxCounter  = document.getElementById("lightbox-counter");

    let lightboxImages = [];
    let lightboxIndex = -1;
    let lightboxSourceGallery = null;

    function setActiveButton(section) {
      portraitsBtn.classList.toggle("active", section === "portraits");
      journalBtn.classList.toggle("active", section === "journal");
      miscBtn.classList.toggle("active", section === "misc");
      aboutBtn.classList.toggle("active", section === "about");
    }

    function closeAllOverlays() {
      portraitsGallery.classList.remove("visible");
      journalGallery.classList.remove("visible");
      miscGallery.classList.remove("visible");
      aboutPanel.classList.remove("visible");
    }

    function showOverlay(name) {
      closeAllOverlays();
      if (name === "portraits") portraitsGallery.classList.add("visible");
      if (name === "journal") journalGallery.classList.add("visible");
      if (name === "misc") miscGallery.classList.add("visible");
      if (name === "about") aboutPanel.classList.add("visible");
    }

    function activateSection(section, evt) {
      if (activeSection === section) {
        activeSection = null;
        setActiveButton(null);
        closeAllOverlays();
        closeLightbox();
        return;
      }

      activeSection = section;
      setActiveButton(section);

      const mood = MOODS[section] || MOODS.portraits;

      if (evt && evt.shiftKey) {
        const key = mood.fill.paletteKey;
        if (PALETTES[key] && PALETTES[key].length > 1) {
          mood.fill.paletteIndex = (mood.fill.paletteIndex + 1) % PALETTES[key].length;
        }
      }

      applyMood(mood, { rebuild: false, rerollStyles: true });
      setNewColor(mood);
      showOverlay(mood.overlay);
      trackOnce(`section/${section}`, `Opened ${section}`);
      if (isPhone) scheduleViewCheck(document.getElementById(`${mood.overlay}-gallery`));
    }

    portraitsBtn.addEventListener("click", (e) => activateSection("portraits", e));
    journalBtn.addEventListener("click", (e) => activateSection("journal", e));
    miscBtn.addEventListener("click", (e) => activateSection("misc", e));
    aboutBtn.addEventListener("click", (e) => activateSection("about", e));

    // Arrow scrolling for all galleries
    const SCROLL_AMOUNT = 350;

    function attachArrows(galleryEl, stripEl) {
      const left = galleryEl.querySelector(".gallery-arrow.left");
      const right = galleryEl.querySelector(".gallery-arrow.right");
      // On phones each arrow tap moves exactly one image
      const step = () => isPhone ? stripEl.clientWidth : SCROLL_AMOUNT;
      left.addEventListener("click", () => stripEl.scrollBy({ left: -step(), behavior: "smooth" }));
      right.addEventListener("click", () => stripEl.scrollBy({ left: step(), behavior: "smooth" }));
    }

    // "3 / 33" counter under the image (only shown on phones)
    const counters = [];

    function attachCounter(galleryEl, stripEl) {
      const el = document.createElement("div");
      el.className = "gallery-count";
      galleryEl.appendChild(el);
      const update = () => {
        const total = stripEl.querySelectorAll(".gallery-item, .gallery-link").length; // tiles, even inside groups
        const index = Math.round(stripEl.scrollLeft / Math.max(1, stripEl.clientWidth));
        el.textContent = `${Math.min(index + 1, total)} / ${total}`;
      };
      stripEl.addEventListener("scroll", update, { passive: true });
      counters.push(update);
      update();
    }

    function setLightboxImage(index) {
      if (!lightboxImages.length) return;

      if (index < 0) index = lightboxImages.length - 1;
      if (index >= lightboxImages.length) index = 0;

      lightboxIndex = index;
      const imgEl = lightboxImages[lightboxIndex];
      lightboxImage.src = imgEl.src;
      lightboxImage.alt = imgEl.alt || "";
      lightboxCounter.textContent = `${lightboxIndex + 1} / ${lightboxImages.length}`;
      trackArtView(lightboxSourceGallery, imgEl);

      if (lightboxSourceGallery && imgEl.closest(".gallery-item")) {
        imgEl.closest(".gallery-item").scrollIntoView({
          behavior: "smooth",
          block: "nearest",
          inline: "center"
        });
      }
    }

    let focusBeforeLightbox = null;

    function openLightbox(images, index, sourceGallery) {
      focusBeforeLightbox = document.activeElement;
      lightboxImages = images;
      lightboxSourceGallery = sourceGallery;
      lightbox.classList.add("visible");
      lightbox.setAttribute("aria-hidden", "false");
      setLightboxImage(index);
      lightboxNext.focus({ preventScroll: true });
    }

    function closeLightbox() {
      const wasOpen = lightbox.classList.contains("visible");
      // Put keyboard focus back on the image that was opened
      if (wasOpen && focusBeforeLightbox && focusBeforeLightbox.focus) {
        focusBeforeLightbox.focus({ preventScroll: true });
      }
      focusBeforeLightbox = null;
      lightbox.classList.remove("visible");
      lightbox.setAttribute("aria-hidden", "true");
      lightboxImage.src = "";
      lightboxImage.alt = "";
      lightboxCounter.textContent = "";
      lightboxImages = [];
      lightboxIndex = -1;
      lightboxSourceGallery = null;
    }

    function showPrevLightboxImage() {
      if (!lightbox.classList.contains("visible")) return;
      setLightboxImage(lightboxIndex - 1);
    }

    function showNextLightboxImage() {
      if (!lightbox.classList.contains("visible")) return;
      setLightboxImage(lightboxIndex + 1);
    }

    function attachLightboxToGalleryImages(galleryEl) {
      const images = Array.from(galleryEl.querySelectorAll(".gallery-item img"));

      images.forEach((img, index) => {
        // Reachable with Tab, opens with Enter or Space
        img.tabIndex = 0;
        img.setAttribute("role", "button");
        img.setAttribute("aria-label", `View ${img.alt} full size`);

        img.addEventListener("click", (e) => {
          if (isPhone) return; // phones already show one big image at a time
          e.stopPropagation();
          openLightbox(images, index, galleryEl);
        });

        img.addEventListener("keydown", (e) => {
          if (isPhone || (e.key !== "Enter" && e.key !== " ")) return;
          e.preventDefault();
          openLightbox(images, index, galleryEl);
        });
      });
    }

    // Shuffle the sketchbook pages into a new random order on every visit,
    // new pages included (their NEW tag and the button dot help people find them).
    // Runs before the viewer and counters are set up, so they use the shuffled order.
    const NEW_PAGE_DAYS = 45; // how long a page counts as NEW
    (function shuffleSketchbook() {
      const items = Array.from(journalStrip.children);
      shuffle(items);
      items.forEach((el) => journalStrip.appendChild(el));
    })();

    attachArrows(portraitsGallery, portraitsStrip);
    attachArrows(journalGallery, journalStrip);
    attachArrows(miscGallery, miscStrip);

    attachCounter(portraitsGallery, portraitsStrip);
    attachCounter(journalGallery, journalStrip);
    attachCounter(miscGallery, miscStrip);

    attachLightboxToGalleryImages(portraitsGallery);
    attachLightboxToGalleryImages(journalGallery);

    lightbox.addEventListener("click", closeLightbox);

    lightboxImage.addEventListener("click", (e) => {
      e.stopPropagation();
      closeLightbox();
    });

    lightboxPrev.addEventListener("click", (e) => {
      e.stopPropagation();
      showPrevLightboxImage();
    });

    lightboxNext.addEventListener("click", (e) => {
      e.stopPropagation();
      showNextLightboxImage();
    });

    document.addEventListener("keydown", (e) => {
      if (!lightbox.classList.contains("visible")) return;

      if (e.key === "Escape") {
        closeLightbox();
      } else if (e.key === "ArrowLeft") {
        showPrevLightboxImage();
      } else if (e.key === "ArrowRight") {
        showNextLightboxImage();
      } else if (e.key === "Tab") {
        // Keep Tab inside the open viewer (just the ‹ and › buttons)
        e.preventDefault();
        (document.activeElement === lightboxNext ? lightboxPrev : lightboxNext).focus();
      }
    });

    // ===== Contact (spam-proof email) =====
    document.getElementById("contact-btn").addEventListener("click", () => {
      const parts = ["wchasec", "gmail.com"];
      window.location.href = "mailto:" + parts.join("@");
    });

    // ===== "NEW" tags =====
    // Any gallery item with data-added="YYYY-MM-DD" from the last NEW_DAYS days
    // gets a colored border and a NEW star.
    const NEW_DAYS = NEW_PAGE_DAYS; // same window as the sketchbook shuffle
    const SECTION_BUTTONS = [
      [portraitsGallery, portraitsBtn],
      [journalGallery, journalBtn],
      [miscGallery, miscBtn],
    ];

    // A 12-point "sticker" starburst for the NEW tag
    const NEW_STAR_SVG = (() => {
      const pts = [];
      for (let i = 0; i < 24; i++) {
        const r = i % 2 ? 24 : 31;
        const a = (i * Math.PI) / 12 - Math.PI / 2;
        pts.push(`${(32 + r * Math.cos(a)).toFixed(1)},${(32 + r * Math.sin(a)).toFixed(1)}`);
      }
      // "NEW" drawn in the star itself, centered on the capital letters:
      // baseline sits ~0.36 of the font size below the middle, so the caps' midline is at 32
      return `<svg viewBox="0 0 64 64" aria-hidden="true"><polygon points="${pts.join(" ")}"/>` +
             `<text x="32" y="${(32 + 14 * 0.36).toFixed(1)}" text-anchor="middle">NEW</text></svg>`;
    })();

    for (const [galleryEl] of SECTION_BUTTONS) {
      galleryEl.querySelectorAll("[data-added]").forEach((item) => {
        const added = new Date(item.dataset.added + "T00:00:00");
        const days = (Date.now() - added) / 86400000;
        if (days >= 0 && days <= NEW_DAYS) {
          item.classList.add("is-new");
          const star = document.createElement("div");
          star.className = "new-star";
          star.innerHTML = NEW_STAR_SVG;
          item.appendChild(star);
        }
      });
    }

    // Rule: the NEW star's outline uses the FIRST color of the section's triangle
    // palette (reorder that palette in PALETTES to change it). Sections whose
    // triangles aren't filled with color (Portraits) use black.
    function setNewColor(mood) {
      let color = "#000000";
      if (mood.fill.enabled) {
        const group = PALETTES[mood.fill.paletteKey] || [["#000000"]];
        color = group[Math.max(0, Math.min(mood.fill.paletteIndex, group.length - 1))][0];
      }
      document.documentElement.style.setProperty("--new-color", color);
    }

    // ===== Visitor counts (GoatCounter: free, no cookies) =====
    // Put your GoatCounter code here (e.g. "iwillchase") to start counting visits.
    const GOATCOUNTER_CODE = "iwillchase";
    if (GOATCOUNTER_CODE && location.protocol.startsWith("http")) {
      const gc = document.createElement("script");
      gc.async = true;
      gc.src = "https://gc.zgo.at/count.js";
      gc.dataset.goatcounter = `https://${GOATCOUNTER_CODE}.goatcounter.com/count`;
      document.body.appendChild(gc);
    }

    // ===== Which art gets looked at most (separate GoatCounter site) =====
    // Art views, section opens and game clicks go to their OWN GoatCounter site,
    // so the main site's visit, browser and phone numbers stay clean.
    // Shows up there as e.g. "view/journal/Journal_BackToSleep3".
    // Each thing counts once per visit, so flipping back and forth doesn't inflate it.
    const GOATCOUNTER_ART_CODE = "iwillchase-art";
    const tracked = new Set();

    function trackOnce(path, title) {
      if (!GOATCOUNTER_ART_CODE || !location.protocol.startsWith("http") || tracked.has(path)) return;
      tracked.add(path);
      // GoatCounter's no-script counter: a tiny image request
      const q = new URLSearchParams({ p: path, t: title, e: "true", rnd: Math.random().toString(36).slice(2) });
      new Image().src = `https://${GOATCOUNTER_ART_CODE}.goatcounter.com/count?${q}`;
    }

    function artName(imgEl) {
      return decodeURIComponent(imgEl.src.split("/").pop().replace(/\.\w+$/, ""));
    }

    function trackArtView(galleryEl, imgEl) {
      if (!galleryEl || !imgEl) return;
      const section = galleryEl.id.replace("-gallery", "");
      trackOnce(`view/${section}/${artName(imgEl)}`, `Viewed ${section}: ${artName(imgEl)}`);
    }

    // Phones: an image counts as viewed once someone stops on it for a second
    const viewTimers = new Map();

    function scheduleViewCheck(galleryEl) {
      if (!galleryEl) return;
      clearTimeout(viewTimers.get(galleryEl));
      viewTimers.set(galleryEl, setTimeout(() => {
        if (!isPhone || !galleryEl.classList.contains("visible")) return;
        const strip = galleryEl.querySelector(".gallery-strip");
        const index = Math.round(strip.scrollLeft / Math.max(1, strip.clientWidth));
        const item = strip.querySelectorAll(".gallery-item, .gallery-link")[index];
        trackArtView(galleryEl, item && item.querySelector("img"));
      }, 1000));
    }

    for (const [galleryEl] of SECTION_BUTTONS) {
      galleryEl.querySelector(".gallery-strip")
        .addEventListener("scroll", () => { if (isPhone) scheduleViewCheck(galleryEl); }, { passive: true });
    }

    // Game tiles: count "Play Game!" clicks
    document.querySelectorAll(".gallery-link").forEach((link) => {
      link.addEventListener("click", () => {
        const game = link.href.split("/").filter(Boolean).pop();
        trackOnce(`play/${game}`, `Clicked play: ${game}`);
      });
    });

    // ===== Newsletter signup =====
    // Put your Buttondown username here (e.g. "iwillchase") to show the signup box.
    const BUTTONDOWN_USER = "iwillchase";
    const subscribeForm = document.getElementById("subscribe-form");
    if (BUTTONDOWN_USER) {
      subscribeForm.action = `https://buttondown.com/api/emails/embed-subscribe/${BUTTONDOWN_USER}`;
      subscribeForm.hidden = false;
    }

    // ===== Phone detection =====
    // Narrow screens, or touch screens held sideways (short), count as phones.
    function updatePhoneMode() {
      isPhone = PHONE_QUERY.matches;
      document.documentElement.classList.toggle("phone", isPhone);
      if (isPhone) closeLightbox();
      counters.forEach((update) => update());
    }
    PHONE_QUERY.addEventListener("change", updatePhoneMode);
    updatePhoneMode();

    // Start
    resize();
  </script>
</body>
</html>
